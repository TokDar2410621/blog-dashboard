<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Gridar{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;color:#1a1a1a;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width:600px;margin:0 auto;background:#ffffff;">
    <tr>
      <td style="padding:24px 32px 0 32px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
          <tr>
            <td style="font-size:20px;font-weight:bold;color:#10b981;">Gridar</td>
            <td style="text-align:right;font-size:12px;color:#888;">Audit + generation SEO FR-CA</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px;font-size:15px;line-height:1.55;color:#1a1a1a;">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 32px;border-top:1px solid #eee;font-size:11px;line-height:1.5;color:#888;">
        Gridar - Arivex Studio - Saint-Hyacinthe, QC<br>
        Tu recois ce courriel parce que tu as audite ton site sur <a href="https://gridar.app/audit" style="color:#10b981;text-decoration:none;">gridar.app/audit</a>.
        {% block unsubscribe %}<a href="https://gridar.app/unsubscribe?email={{ lead.email }}" style="color:#888;text-decoration:underline;">Se desinscrire</a>{% endblock %}
      </td>
    </tr>
  </table>
</body>
</html>
